# Example configuration file for anomaly detector

# Model settings
model:
  threshold_percentile: 90  # Percentile for anomaly threshold (75-98)
  contamination: 0.1        # Expected proportion of anomalies
  n_estimators: 300         # Number of trees in Isolation Forest
  max_features: 300         # Max features for CountVectorizer

# Service settings
service:
  host: "0.0.0.0"
  port: 8080
  workers: 4                # Number of uvicorn workers

# Logging
logging:
  level: "INFO"             # DEBUG, INFO, WARNING, ERROR
  format: "json"            # json or text

# Prometheus
metrics:
  enabled: true
  path: "/metrics"

# Performance
performance:
  max_batch_size: 100       # Max logs to process in one batch
  timeout_seconds: 30       # Request timeout
